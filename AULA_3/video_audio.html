<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Vídeo</title>
</head>
<body>
    <h1>Vídeo Local de Teste (via link público)</h1>
    <video width="600" controls autoplay muted loop playsinline>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        Seu navegador não suporta vídeo.
    </video>

    <h1>Vídeo do YouTube (embed correto)</h1>
    <iframe width="560" height="315"
        src="https://www.youtube.com/embed/xm3YgoEiEDc"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
    </iframe>
</body>
</html>
