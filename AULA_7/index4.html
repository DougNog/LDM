<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap</title>

  <!-- Bootstrap CSS -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link 
    rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  >
</head>
<body>
  <!-- Cabeçalho -->
  <header class="bg-dark text-white p-3">
    <div class="container d-flex flex-wrap justify-content-between align-items-center">
      <h1 class="h3 mb-0">Meu Site Bootstrap</h1>
      <nav>
        <ul class="nav">
          <li class="nav-item"><a href="#" class="nav-link text-white">Home</a></li>
          <li class="nav-item"><a href="#" class="nav-link text-white">Features</a></li>
          <li class="nav-item"><a href="#" class="nav-link text-white">Sobre</a></li>
          <li class="nav-item"><a href="#" class="nav-link text-white">Contato</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Body -->
  <main class="container my-5 text-center">
    <h2 class="mb-4">Bem-vindo ao meu site!</h2>
    <p class="lead">Este é um exemplo simples usando Bootstrap com cabeçalho, conteúdo principal e rodapé.</p>

    <!-- Imagem -->
    <img 
      src="/AULA_7/IMG/win_fundo.webp" 
      alt="Imagem exemplo" 
      class="img-fluid rounded shadow"
    >
  </main>

  <!-- Rodapé -->
  <footer class="bg-dark text-white text-center py-4 border-top border-3 border-primary">
    <div class="container">
      <div class="d-flex flex-column align-items-center">
        <i class="bi bi-bootstrap-fill fs-2 mb-2 text-primary"></i>
        <p class="mb-1">© 2025 Meu Site - Todos os direitos reservados</p>
        <small class="text-secondary">Desenvolvido com Bootstrap</small>
      </div>
    </div>
  </footer>
</body>
</html>
