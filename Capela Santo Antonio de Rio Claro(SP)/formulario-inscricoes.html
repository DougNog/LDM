<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Inscrições - Capela Santo Antônio</title>
    <link rel = "stylesheet" href="capela.css">
</head>
<body>

<header>
    <h1>Capela Santo Antônio</h1>
    <p>Rio Claro (SP)</p>
</header>

<main>
    <section id="inscricoes">
        <h2>Inscrição para Eventos</h2>
        <form>
            <label>Nome*</label>
            <input type="text" required>

            <label>Telefone</label>
            <input type="tel">

            <label>Evento*</label>
            <select required>
                <option value="">Selecione...</option>
                <option value="catequese">Catequese Infantil</option>
                <option value="grupo">Grupo de Oração</option>
                <option value="missa">Missa Jovem</option>
            </select>

            <button type="submit">Enviar</button>
        </form>
        
        <p><a href="index.html">← Voltar para a página principal</a></p>
    </section>
</main>

</body>
</html>
